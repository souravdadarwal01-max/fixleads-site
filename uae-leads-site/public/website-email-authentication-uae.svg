<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Website email authentication workflow</title>
<desc id="desc">An illustration showing a website enquiry travelling through a verified email sender using SPF, DKIM and DMARC before reaching a business inbox.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10263F"/><stop offset="1" stop-color="#0F6E7A"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eef6f6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#06172a" flood-opacity=".22"/></filter>
</defs>
<rect width="1400" height="900" fill="#eef4f5"/>
<circle cx="1200" cy="120" r="250" fill="#d7e9e8"/><circle cx="120" cy="820" r="250" fill="#dce9f1"/>
<rect x="85" y="78" width="1230" height="744" rx="42" fill="url(#bg)"/>
<text x="150" y="170" fill="#a9d9d7" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">FIXLEADS STUDIO · WEBSITE RELIABILITY</text>
<text x="150" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">Make every enquiry email easier to trust</text>
<text x="150" y="300" fill="#d7e9ed" font-family="Arial,sans-serif" font-size="24">A practical route from website form to business inbox</text>
<g filter="url(#shadow)">
  <rect x="135" y="390" width="245" height="250" rx="24" fill="url(#card)"/><rect x="435" y="390" width="245" height="250" rx="24" fill="url(#card)"/>
  <rect x="735" y="390" width="245" height="250" rx="24" fill="url(#card)"/><rect x="1035" y="390" width="245" height="250" rx="24" fill="url(#card)"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <circle cx="257" cy="465" r="40" fill="#d9f1ed"/><rect x="234" y="448" width="46" height="34" rx="5" fill="none" stroke="#0F6E7A" stroke-width="5"/><path d="m236 451 21 17 21-17" fill="none" stroke="#0F6E7A" stroke-width="4"/>
  <text x="257" y="545" fill="#10263F" font-size="25" font-weight="700">Website form</text><text x="257" y="580" fill="#526779" font-size="18">Capture and save</text><text x="257" y="606" fill="#526779" font-size="18">the enquiry</text>
  <circle cx="557" cy="465" r="40" fill="#d9f1ed"/><path d="M535 455h44v28h-44z M542 448h30" fill="none" stroke="#0F6E7A" stroke-width="5" stroke-linejoin="round"/><path d="M545 465h24 M545 475h16" stroke="#0F6E7A" stroke-width="4" stroke-linecap="round"/>
  <text x="557" y="545" fill="#10263F" font-size="25" font-weight="700">Email sender</text><text x="557" y="580" fill="#526779" font-size="18">Authenticated</text><text x="557" y="606" fill="#526779" font-size="18">SMTP or email API</text>
  <circle cx="857" cy="465" r="40" fill="#d9f1ed"/><path d="M857 435 883 445v19c0 18-13 29-26 36-13-7-26-18-26-36v-19z" fill="none" stroke="#0F6E7A" stroke-width="5"/><path d="m844 465 9 9 18-20" fill="none" stroke="#0F6E7A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="857" y="545" fill="#10263F" font-size="25" font-weight="700">SPF · DKIM · DMARC</text><text x="857" y="580" fill="#526779" font-size="18">Verify sender and</text><text x="857" y="606" fill="#526779" font-size="18">domain alignment</text>
  <circle cx="1157" cy="465" r="40" fill="#d9f1ed"/><rect x="1133" y="449" width="48" height="32" rx="5" fill="none" stroke="#0F6E7A" stroke-width="5"/><path d="m1135 452 22 17 22-17" fill="none" stroke="#0F6E7A" stroke-width="4"/>
  <text x="1157" y="545" fill="#10263F" font-size="25" font-weight="700">Business inbox</text><text x="1157" y="580" fill="#526779" font-size="18">Deliver, monitor</text><text x="1157" y="606" fill="#526779" font-size="18">and respond</text>
</g>
<g stroke="#91d4cf" stroke-width="7" stroke-linecap="round" fill="none"><path d="M385 515h42m-13-13 13 13-13 13"/><path d="M685 515h42m-13-13 13 13-13 13"/><path d="M985 515h42m-13-13 13 13-13 13"/></g>
<text x="150" y="735" fill="#d7e9ed" font-family="Arial,sans-serif" font-size="21">A successful form message is only the start — verify the full delivery path.</text>
</svg>