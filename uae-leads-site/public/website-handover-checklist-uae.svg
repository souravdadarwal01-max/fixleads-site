  <text x="790" y="510" fill="#12324a" font-family="Arial, sans-serif" font-size="25" font-weight="700">A practical UAE guide</text>
  <text x="790" y="544" fill="#527084" font-family="Arial, sans-serif" font-size="17">Keep access, files and renewals organised</text>
