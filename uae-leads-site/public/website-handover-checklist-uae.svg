      <text x="492" y="386" fill="#527084" font-size="14">Business Profile · Listings</text>
      <rect x="130" y="428" width="570" height="80" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="171" cy="468" r="22" fill="url(#green)"/>
