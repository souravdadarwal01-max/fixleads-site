      <text x="211" y="462" fill="#12324a" font-size="20" font-weight="700">ACCESS TESTED BEFORE SIGN-OFF</text>
      <text x="211" y="486" fill="#527084" font-size="15">Enquiries · Recovery · Renewals · Ownership</text>
