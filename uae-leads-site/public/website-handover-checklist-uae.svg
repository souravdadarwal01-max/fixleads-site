      <path d="M158 376v-14l10-6 10 6v14z" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>
      <text x="202" y="363" fill="#12324a" font-size="19" font-weight="700">ANALYTICS</text>
      <text x="202" y="386" fill="#527084" font-size="14">GA4 · Search Console · Tags</text>
      <rect x="420" y="328" width="280" height="82" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="458" cy="369" r="19" fill="#ffedd5"/>
