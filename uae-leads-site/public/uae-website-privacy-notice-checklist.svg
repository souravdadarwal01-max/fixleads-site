<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UAE website privacy notice checklist</title>
  <desc id="desc">A website enquiry form beside a privacy shield and a checklist of data, purpose and customer choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f4e"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071433" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="210" fill="#7c3aed" opacity=".22"/>
  <circle cx="100" cy="570" r="220" fill="#059669" opacity=".16"/>
  <path d="M0 470 C250 390 370 610 650 520 S1020 410 1200 485 V630 H0Z" fill="#0b173c" opacity=".42"/>
  <g transform="translate(82 92)">
    <rect x="0" y="0" width="530" height="430" rx="28" fill="#fff" filter="url(#shadow)"/>
    <rect x="0" y="0" width="530" height="66" rx="28" fill="#f1f5f9"/>
    <path d="M0 38h530v28H0z" fill="#f1f5f9"/>
    <circle cx="36" cy="33" r="7" fill="#ef4444"/><circle cx="62" cy="33" r="7" fill="#f59e0b"/><circle cx="88" cy="33" r="7" fill="#10b981"/>
    <rect x="36" y="102" width="250" height="15" rx="7.5" fill="#1e293b"/>
    <rect x="36" y="132" width="370" height="10" rx="5" fill="#cbd5e1"/>
    <text x="36" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">CUSTOMER ENQUIRY</text>
    <rect x="36" y="207" width="210" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="262" y="207" width="230" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="54" y="238" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Name</text>
    <text x="280" y="238" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Phone or email</text>
    <rect x="36" y="278" width="456" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="54" y="316" font-family="Arial, sans-serif" font-size="14" fill="#64748b">How can we help?</text>
    <rect x="36" y="365" width="18" height="18" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
    <path d="m40 374 4 4 7-9" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="379" font-family="Arial, sans-serif" font-size="13" fill="#475569">Read the privacy notice</text>
    <rect x="360" y="356" width="132" height="42" rx="12" fill="#1e40af"/>
    <text x="426" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">SEND ENQUIRY</text>
  </g>
  <g transform="translate(690 112)">
    <path d="M180 0 330 58v126c0 112-70 190-150 226C100 374 30 296 30 184V58Z" fill="url(#shield)" filter="url(#shadow)"/>
    <path d="M180 42 291 85v97c0 83-49 143-111 177-62-34-111-94-111-177V85Z" fill="none" stroke="#d1fae5" stroke-width="7" opacity=".9"/>
    <path d="m121 188 42 42 82-91" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(0 438)">
      <text x="180" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#a7f3d0">PRIVACY BY DESIGN</text>
      <text x="180" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Clear data · Clear purpose · Clear choices</text>
    </g>
  </g>
</svg>