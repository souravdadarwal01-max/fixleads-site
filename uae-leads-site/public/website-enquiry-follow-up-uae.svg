<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Website enquiry follow-up workflow</title>
<desc id="desc">A clean illustration of a new website enquiry moving through acknowledgement, qualification, follow-up and booking stages.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10263F"/><stop offset="1" stop-color="#0F6E7A"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1f7f8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06172a" flood-opacity=".22"/></filter>
</defs>
<rect width="1400" height="900" fill="#eef4f5"/>
<circle cx="1180" cy="120" r="260" fill="#d5e9e8"/>
<circle cx="120" cy="820" r="260" fill="#dce9f1"/>
<rect x="90" y="90" width="1220" height="720" rx="42" fill="url(#bg)"/>
<text x="160" y="190" fill="#a9d9d7" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">FIXLEADS STUDIO · OPERATIONS GUIDE</text>
<text x="160" y="265" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">Turn enquiries into clear next steps</text>
<text x="160" y="315" fill="#d7e9ed" font-family="Arial,sans-serif" font-size="25">A simple follow-up workflow for UAE service businesses</text>
<g filter="url(#shadow)">
  <rect x="150" y="405" width="235" height="250" rx="24" fill="url(#panel)"/>
  <rect x="430" y="405" width="235" height="250" rx="24" fill="url(#panel)"/>
  <rect x="710" y="405" width="235" height="250" rx="24" fill="url(#panel)"/>
  <rect x="990" y="405" width="235" height="250" rx="24" fill="url(#panel)"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <circle cx="267" cy="475" r="38" fill="#d9f1ed"/><path d="M246 468h42v28h-42z M250 462h34" fill="none" stroke="#0F6E7A" stroke-width="5" stroke-linejoin="round"/><path d="m249 469 18 14 18-14" fill="none" stroke="#0F6E7A" stroke-width="4"/>
  <text x="267" y="548" fill="#10263F" font-size="26" font-weight="700">Receive</text><text x="267" y="585" fill="#526779" font-size="18">Capture the request</text><text x="267" y="612" fill="#526779" font-size="18">and assign an owner</text>
  <circle cx="547" cy="475" r="38" fill="#d9f1ed"/><circle cx="539" cy="469" r="11" fill="none" stroke="#0F6E7A" stroke-width="5"/><path d="M519 500c3-17 36-17 40 0 M557 460l13 13-13 13" fill="none" stroke="#0F6E7A" stroke-width="5" stroke-linecap="round"/>
  <text x="547" y="548" fill="#10263F" font-size="26" font-weight="700">Respond</text><text x="547" y="585" fill="#526779" font-size="18">Acknowledge and</text><text x="547" y="612" fill="#526779" font-size="18">set expectations</text>
  <circle cx="827" cy="475" r="38" fill="#d9f1ed"/><path d="M808 455h38v30h-38z M815 494h24 M820 486v8" fill="none" stroke="#0F6E7A" stroke-width="5" stroke-linejoin="round"/><path d="M815 465h24 M815 474h16" stroke="#0F6E7A" stroke-width="4" stroke-linecap="round"/>
  <text x="827" y="548" fill="#10263F" font-size="26" font-weight="700">Qualify</text><text x="827" y="585" fill="#526779" font-size="18">Confirm service, area</text><text x="827" y="612" fill="#526779" font-size="18">and useful details</text>
  <circle cx="1107" cy="475" r="38" fill="#d9f1ed"/><path d="M1088 480l13 13 27-31" fill="none" stroke="#0F6E7A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1107" y="548" fill="#10263F" font-size="26" font-weight="700">Next step</text><text x="1107" y="585" fill="#526779" font-size="18">Quote, assessment</text><text x="1107" y="612" fill="#526779" font-size="18">or booking</text>
</g>
<g stroke="#91d4cf" stroke-width="7" stroke-linecap="round" fill="none"><path d="M390 530h30m-12-12 12 12-12 12"/><path d="M670 530h30m-12-12 12 12-12 12"/><path d="M950 530h30m-12-12 12 12-12 12"/></g>
<text x="160" y="730" fill="#d7e9ed" font-family="Arial,sans-serif" font-size="22">Own the response · Respect the customer's channel · Record the outcome</text>
</svg>