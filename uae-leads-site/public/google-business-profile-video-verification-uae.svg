    <text x="44" y="184" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#1e40af">made clearer</text>
    <text x="44" y="235" font-family="Arial, sans-serif" font-size="21" fill="#475569">Prepare one live recording that shows:</text>
    <g transform="translate(44 276)">
      <circle cx="18" cy="18" r="18" fill="#dbeafe"/><path d="M18 8c-6 0-10 4-10 10 0 8 10 18 10 18s10-10 10-18c0-6-4-10-10-10zm0 13a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" fill="#1e40af" transform="translate(0 -3) scale(.9)"/>
      <text x="52" y="26" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Location</text>
    </g>
    <g transform="translate(44 338)">
      <circle cx="18" cy="18" r="18" fill="#d1fae5"/><path d="M9 20h18v11H9zM12 9h12v11H12zM15 5h6v4h-6z" fill="#059669"/>
      <text x="52" y="26" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Real work and equipment</text>
    </g>
    <g transform="translate(44 400)">
