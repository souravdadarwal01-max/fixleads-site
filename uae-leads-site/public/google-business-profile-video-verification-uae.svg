    <rect x="94" y="16" width="226" height="438" rx="32" fill="#fff"/>
    <rect x="168" y="27" width="88" height="10" rx="5" fill="#0f172a"/>
    <text x="122" y="83" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">BUSINESS VIDEO</text>
    <rect x="116" y="105" width="182" height="142" rx="18" fill="#dbeafe"/>
    <rect x="139" y="159" width="136" height="60" rx="6" fill="#fff"/>
    <path d="M130 159l77-48 77 48z" fill="#1e40af"/>
    <rect x="151" y="174" width="28" height="45" fill="#bfdbfe"/>
    <rect x="188" y="174" width="38" height="45" fill="#bfdbfe"/>
    <rect x="235" y="174" width="27" height="45" fill="#bfdbfe"/>
    <rect x="178" y="127" width="60" height="22" rx="4" fill="#059669"/>
    <text x="208" y="143" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#fff">BUSINESS</text>
    <circle cx="207" cy="277" r="25" fill="#fee2e2"/>
    <circle cx="207" cy="277" r="12" fill="#dc2626"/>
    <text x="207" y="326" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">One continuous take</text>
    <text x="207" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">At least 30 seconds</text>
    <rect x="135" y="377" width="145" height="40" rx="20" fill="url(#blue)"/>
    <text x="207" y="403" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">Review before upload</text>
