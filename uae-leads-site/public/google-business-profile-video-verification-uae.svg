    <circle cx="35" cy="41" r="18" fill="#dbeafe"/>
    <path d="M35 28c-6 0-10 4-10 10 0 8 10 18 10 18s10-10 10-18c0-6-4-10-10-10zm0 13a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#1e40af"/>
    <text x="65" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Location</text>
    <text x="65" y="56" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Signs & landmarks</text>
    <rect x="-10" y="292" width="190" height="82" rx="18" fill="#fff" filter="url(#shadow)"/>
    <circle cx="28" cy="333" r="18" fill="#d1fae5"/>
    <path d="M19 333h18v12H19zM22 324h12v9H22z" fill="#059669"/>
    <text x="58" y="329" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Real equipment</text>
    <text x="58" y="348" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Tools & workspace</text>
